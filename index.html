<!-- Achtergrond: lucht, wolken, regenboog en heuvels -->

  <g fill="none" stroke-width="16" opacity=".55">
    <circle cx="800" cy="640" r="270" stroke="#ff9db5"/><circle cx="800" cy="640" r="254" stroke="#ffc98a"/>
    <circle cx="800" cy="640" r="238" stroke="#fff0a3"/><circle cx="800" cy="640" r="222" stroke="#b6eab8"/>

  </g>
  <g fill="#fff" opacity=".85">
    <path d="M90 190 a34 34 0 0 1 62 -18 a44 44 0 0 1 82 14 a30 30 0 0 1 -6 60 h-126 a30 30 0 0 1 -12 -56z"/>

<!-- Beginscherm -->
<section id="start" class="scherm">
  <div class="duo" aria-hidden="true"><svg class="dier"><use href="#t-eenhoorn"/></svg><svg class="dier"><use href="#t-kat"/></svg></div>
  <h1>Balimba leest</h1>
  <div class="kiesrij"><span class="label">Level</span><div class="kiezer" id="levels"></div></div>
  <div class="kiesrij"><span class="label">Ronde</span><div class="kiezer" id="rondes"></div></div>
  <p class="waar" id="waar"></p>
  <div class="keuze">
    <button class="vorm" id="kiesSamen">
      <span class="plaatje" aria-hidden="true">👨‍👧</span>
      <span class="naam">Samen</span>
    </button>
    <button class="vorm" id="kiesAlleen">
      <span class="plaatje" aria-hidden="true">🧒</span>
      <span class="naam">Alleen</span>
    </button>
  </div>
  <p class="waar verborgen" id="alleenUitleg">Alleen spelen kan zodra de woorden van deze ronde zijn ingesproken.</p>
  <p class="fout verborgen" id="laadfout">De woorden konden niet geladen worden. Controleer de verbinding en herlaad de pagina.</p>
</section>

<!-- Spelscherm -->
<section id="spel" class="scherm verborgen">
  <header>
    <button class="klein" id="naarHuis" aria-label="Terug naar het begin">⌂</button>
    <div class="sterren" id="sterren" aria-label="Sterren"></div>
    <span></span>
  </header>

  <div class="midden">
    <div class="bord">
      <svg class="dier houdt links" aria-hidden="true"><use href="#t-eenhoorn"/></svg>
      <svg class="dier houdt rechts" aria-hidden="true"><use href="#t-kat"/></svg>
      <div class="woord" id="woord"></div>
    </div>
  </div>

  <footer class="knoppen">
    <button class="rond opnieuw" id="opnieuw" aria-label="Nog een keer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="rond oor" id="oor" aria-label="Hoor het woord">👂</button>
    <button class="rond goed" id="goed" aria-label="Goed">
      <svg class="vink" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="duim" aria-hidden="true">👍</span>
    </button>
  </footer>
</section>

<!-- Ronde klaar -->
<section id="klaar" class="scherm verborgen">
  <div class="duo dans" aria-hidden="true"><svg class="dier"><use href="#t-eenhoorn"/></svg><svg class="dier"><use href="#t-kat"/></svg></div>
  <div class="sterren eind" id="eindsterren" aria-hidden="true"></div>
  <div class="keuze">
    <button class="rond goed" id="verder" aria-label="Volgende ronde">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
    </button>
    <button class="rond stil" id="klaarHuis" aria-label="Terug naar het begin">⌂</button>
  </div>
</section>
